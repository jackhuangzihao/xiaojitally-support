name: 功能建议 / Feature request
description: 描述使用场景和希望解决的问题。Suggest an improvement.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎建议！请使用虚构示例，不要公开账本、备份或账号信息。
        Please use fictional examples and do not include personal financial or account information.
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 你在什么情况下遇到了什么不便？What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的改进 / Proposed improvement
      description: 希望如何改进？也可以补充你考虑过的替代办法。
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 适用平台 / Platform
      options:
        - 通用 / All platforms
        - iPhone
        - iPad
        - Mac
